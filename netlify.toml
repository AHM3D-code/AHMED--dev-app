[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth/:splat"
  status = 200

[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api/v1/:splat"
  status = 200

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin/:splat"
  status = 200

[[redirects]]
  from = "/api/notify"
  to = "/.netlify/functions/notify"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# `netlify dev` reads this to run the Vite dev server and proxy /api/*
# to the functions above on one combined local port.
[dev]
  command = "npm run dev -- --port 5173"
  targetPort = 5173
  port = 8888
  autoLaunch = false
